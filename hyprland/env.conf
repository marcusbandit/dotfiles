#############################
### ENVIRONMENT VARIABLES ###
#############################

# PATH - Include user bins for keybindings
env = PATH,$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

# GTK and QT settings
env = GTK_THEME=Adwaita:dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = KDE_COLOR_SCHEME_PATH=/usr/share/color-schemes/BreezeDark.colors
env = QT_QUICK_CONTROLS_STYLE=gtk

# Cursor settings
env = XCURSOR_THEME,Bibata-Modern-DodgerBlue
env = XCURSOR_SIZE,24

# Terminal for desktop entries with Terminal=true
env = TERMINAL,kitty

# Session information
env = XDG_CURRENT_DESKTOP=Hyprland
env = XDG_SESSION_DESKTOP=Hyprland
env = XDG_SESSION_TYPE=wayland
env = XDG_CONFIG_HOME=~/.config
env = XDG_DATA_HOME=~/.local/share
env = XDG_CACHE_HOME=~/.cache
env = XDG_STATE_HOME=~/.local/state
env = XDG_RUNTIME_DIR=/tmp/hyprland
env = WAYLAND_DISPLAY=wayland-0

# QT/Wayland & Java options
env = QT_WAYLAND_DISABLE_WINDOWDECORATION=1
env = _JAVA_AWT_WM_NONREPARENTING=1
env = _JAVA_OPTIONS=-Dawt.useSystemAAFontSettings=on -Dswing.aatext=true -Dswing.defaultlaf=com.sun.java.swing.plaf.gtk.GTKLookAndFeel

# GPU: AMD Radeon 840M (Krackan iGPU). No NVIDIA hardware on this box.
# Deliberately NOT setting LIBVA_DRIVER_NAME; mesa autodetects radeonsi.
# A stale LIBVA_DRIVER_NAME=nvidia here broke VAAPI entirely and silently
# forced ffmpeg onto the libx264 CPU fallback (AniBeam transcodes ate 12 cores).

# Firefox/Zen Wayland support
env = MOZ_ENABLE_WAYLAND,           1

# Electron/Chromium Wayland support (fixes Vesktop, VSCode, etc)
env = ELECTRON_OZONE_PLATFORM_HINT, auto
