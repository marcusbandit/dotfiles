#! Keybindings

#! Viewport
# Focus
binde  = SUPER, LEFT,  layoutmsg, focus l
binde  = SUPER, RIGHT, layoutmsg, focus r
binde  = SUPER, UP,    layoutmsg, focus u
binde  = SUPER, DOWN,  layoutmsg, focus d

# Workspaces
bind   = SUPER, 1, workspace, 1
bind   = SUPER, 2, workspace, 2
bind   = SUPER, 3, workspace, 3
bind   = SUPER, 4, workspace, 4
bind   = SUPER, 5, workspace, 5
bind   = SUPER, 6, workspace, 6
bind   = SUPER, 7, workspace, 7
bind   = SUPER, 8, workspace, 8
bind   = SUPER, 9, workspace, 9
bind   = SUPER, 0, workspace, 10

bind   = SUPER, grave, togglespecialworkspace, communication
bind   = SUPER, tab,   togglespecialworkspace, music


#! Window

# State
bind   = SUPER,       A, fullscreen,     0           # Fullscreen
bind   = SUPER SHIFT, A, fullscreen,     1           # Maximize
bind   = SUPER,       D, pseudo,         # Pseudo-tile
bind   = SUPER,       G, pin,            # Makes a floating type "Global" - persists across all workspaces.
bind   = SUPER,       Q, killactive,     # Kill the hovered window
bind   = SUPER,       S, togglefloating, # Toggle floating state
bind   = SUPER,       F, layoutmsg,      fit active  # Rescales the current window to fit the entire screen
bind   = SUPER SHIFT, F, layoutmsg,      fit visible # Rescales all the visible windows on the screen to fit the screen

# Layout
binde  = SUPER SHIFT,         LEFT,   movewindow, l
binde  = SUPER SHIFT,         RIGHT,  movewindow, r
binde  = SUPER SHIFT,         UP,     movewindow, u
binde  = SUPER SHIFT,         DOWN,   movewindow, d
bind   = SUPER SHIFT,         RETURN, layoutmsg,  promote
bind   = SUPER SHIFT CONTROL, RIGHT,  layoutmsg,  swapcol r
bind   = SUPER SHIFT CONTROL, LEFT,   layoutmsg,  swapcol l

# Move to workspace
bind   = SUPER SHIFT, 1,     movetoworkspace, 1
bind   = SUPER SHIFT, 2,     movetoworkspace, 2
bind   = SUPER SHIFT, 3,     movetoworkspace, 3
bind   = SUPER SHIFT, 4,     movetoworkspace, 4
bind   = SUPER SHIFT, 5,     movetoworkspace, 5
bind   = SUPER SHIFT, 6,     movetoworkspace, 6
bind   = SUPER SHIFT, 7,     movetoworkspace, 7
bind   = SUPER SHIFT, 8,     movetoworkspace, 8
bind   = SUPER SHIFT, 9,     movetoworkspace, 9
bind   = SUPER SHIFT, 0,     movetoworkspace, 10
bind   = SUPER SHIFT, grave, movetoworkspace, special:communication
bind   = SUPER SHIFT, tab,   movetoworkspace, special:music

# Move / Resize with mouse
bindm  = SUPER,       mouse:272, movewindow
bindm  = SUPER,       mouse:273, resizewindow
bindm  = SUPER,       X,         movewindow
bindm  = SUPER SHIFT, X,         resizewindow

#! Apps

bind   = SUPER,       SPACE,  exec, caelestia shell drawers toggle launcher
bind   = SUPER,       B,      exec, [pseudeo; size 3440 1440;] $browser
bind   = SUPER SHIFT, B,      exec, $browser --private-window
bind   = SUPER,       E,      exec, $terminal -e $filemanager
bind   = SUPER,       RETURN, exec, $terminal

# Copilot key -> Claude in danger mode inside tmux; drop to a plain shell on exit instead of closing the window (the MS Copilot key emits Super+Shift+F23)
bind   = SUPER SHIFT, F23,    exec, $terminal -e sh -c 'tmux new-session "claude --dangerously-skip-permissions"; export DISABLE_AUTO_TMUX=1; exec zsh'


#! Utils

# Network
bind   = SUPER,       I, exec, ~/bin/wifi-menu                          # Wi-Fi menu (connect to any network)

# Caelestia Shell
bind   = SUPER,       N, exec, caelestia shell drawers toggle sidebar   # Toggle Notification panel
bind   = SUPER SHIFT, D, exec, caelestia shell drawers toggle dashboard # Toggle Dashboard
bind   = SUPER,       P, exec, caelestia shell drawers toggle session   # Toggle Power Menu
bind   = SUPER,       Z, exec, caelestia shell bar togglePersistent     # Toggle Bar

# Clipboard
bind   = SUPER,       J, exec, ~/.local/bin/ollama-clipboard                                                                                                            # Send Clipboard to Ollama
bind   = SUPER,       V, exec, $terminal --class clipse -e clipse                                                                                                       # Clipboard history
bind   = CTRL ALT,    V, exec, env TYPE_CLIPBOARD_DEBUG=1 /home/bandit/.local/bin/type-clipboard                                                                        # Type clipboard
bind   = SUPER SHIFT, T, exec, grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l eng | wl-copy && rm "/tmp/ocr_image.png" # Copy text from screenshot
bind   = SUPER SHIFT, S, exec, caelestia shell picker openFreezeClip                                                                                                    # Take screenshot

# Tools
bind   = SUPER SHIFT, C,     exec, hyprpicker -a --format=hex                                                                                                                                               # Color Picker
bind   = SUPER,       R,     exec, hyprctl dispatch submap xhisper && xhisper                                                                                                                               # Start voice dictation
bind   = SUPER,       W,     exec, ~/.local/bin/swww-random                                                                                                                                                 # Cycle backgrounds
bind   = CTRL SHIFT,  grave, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "gnome-system-monitor" "plasma-systemmonitor --page-name Processes" "command -v btop && kitty -1 fish -c btop" # Task manager

# Cursor (mouse via keyboard)
binde  = SUPER CTRL,       LEFT,  exec, ydotool mousemove -- -20 0
binde  = SUPER CTRL,       RIGHT, exec, ydotool mousemove -- 20 0
binde  = SUPER CTRL,       UP,    exec, ydotool mousemove -- 0 -20
binde  = SUPER CTRL,       DOWN,  exec, ydotool mousemove -- 0 20
bind   = SUPER CTRL,       SPACE, exec, ydotool click 0xC0
bind   = SUPER CTRL ALT_L, SPACE, exec, ydotool click 0xC1

# Quickshell
bindd  = Super, Slash, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet
#bindn = , mouse:275, exec, ~/.local/bin/toggle-quickshell

# Emergency
bind   = SUPER, F4, exit, # Exit Hyprland immediately (emergency escape)


#! Laptop

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Media
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPrev,  exec, playerctl previous



#! Submaps

submap = xhisper
bind   = SUPER, R,      exec, xhisper # Stop voice dictation at cursor
bind   = ,      ESCAPE, exec, pkill -f "pw-record" 2>/dev/null; pkill -f "xhisper" 2>/dev/null; caelestia shell xhisper set hidden && hyprctl dispatch submap reset
submap = reset