#######################################
### HYPRLAND WINDOW RULES (v0.53+ SYNTAX)
#######################################
# Reference: https://wiki.hypr.land/Configuring/Window-Rules/

#######################################
### VARIABLES
#######################################

# Border colors
$floating_border_active   = rgb(00d4ff)
$floating_border_inactive = rgb(005577)
$pinned_border_active     = rgb(B98578)
$pinned_border_inactive   = rgb(5a3c3c)

# Common sizes
$popup_width              = 880
$popup_height             = 652
$dialog_width             = 800
$dialog_height            = 600
$terminal_float_width     = 1350
$terminal_float_height    = 900

# Monitor identifiers (match your hyprland.conf)
$ultrawide                = HDMI-A-1
$vertical_side            = DP-1


#######################################
### WORKSPACE ASSIGNMENT TO MONITORS ###
#######################################

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:DP-1, layout:scrolling, layoutopt:direction:down
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# Special workspaces
workspace = special:music, monitor:DP-1


#######################################
### GLOBAL RULES
#######################################

# Suppress maximize events for all windows (prevents apps from forcing maximize)
windowrule {
    name = global-suppress-maximize
    match:class = .*
    suppress_event = maximize
}


#######################################
### VISUAL / BORDER RULES
#######################################

# Floating (not pinned) - cyan border
windowrule = border_color $floating_border_active $floating_border_inactive, match:float 1, match:pin 0

# Pinned - coral/warm border
windowrule = border_color $pinned_border_active $pinned_border_inactive, match:pin 1


#######################################
### TERMINAL & UTILITY WINDOWS
#######################################

# Clipse clipboard manager - floating popup
windowrule {
    name = clipse-popup
    match:class = clipse
    float = on
    size = $popup_width $popup_height
    stay_focused = on
}

# System update terminal - floating centered
windowrule {
    name = auto-update-terminal
    match:class = auto-update
    float = on
    size = $dialog_width $dialog_height
    center = on
}


#######################################
### BROWSER RULES
#######################################

# Zen Browser - workspace assignment
windowrule {
    name = zen-browser-workspace
    match:class = ^(zen)$
    workspace = 1
}


#######################################
### DEVELOPMENT TOOLS
#######################################

# Cursor IDE - workspace assignment
windowrule {
    name = cursor-ide-workspace
    match:class = ^(cursor)$
    workspace = 2
}


#######################################
### MEDIA & ENTERTAINMENT
#######################################

# mpv - borderless, no rounding, pure video
windowrule {
    name = mpv-borderless
    match:class = ^(mpv)$
    border_size = 0
    rounding = 0
}

# Spotify - transparency and special workspace
windowrule {
    name = spotify-opacity
    match:class = ^(spotify)$
    opacity = 0.9 override
}

windowrule {
    name = spotify-workspace
    match:class = ^(spotify)$
    workspace = special:music
}

# Vesktop (Discord) - special workspace
windowrule {
    name = vesktop-workspace
    match:class = ^(vesktop)$
    workspace = special:communication
}


#######################################
### ANDROID (WAYDROID)
#######################################

# Waydroid full UI - floating, phone-like size
windowrule {
    name = waydroid-float
    match:class = ^(Waydroid)$
    float = on
    size = 675 1350
    center = on
}


#######################################
### GAMING
#######################################

# Hytale Launcher - workspace 2, centered
windowrule {
    name = hytale-launcher
    match:class = ^(Hytale-launcher)$
    workspace = 2
    center = on
}

# Steam games - workspace 3
windowrule {
    name = steam-games-workspace
    match:class = ^(steam_app.*)$
    workspace = 3
}

# Sober (Roblox) - disable compositor blur and rounding to avoid artifacts
windowrule {
    name = sober-no-blur
    match:class = ^(sober)$
    no_blur = on
    rounding = 0
}

# Minecraft - pseudo-tiled at ultrawide resolution
windowrule {
    name = minecraft-layout
    match:class = ^Minecraft.*
    tile = on
    pseudo = on
    size = 3440 1440
}


#######################################
### AUDIO PRODUCTION
#######################################

# FL Studio - force tiled (Wine app)
windowrule {
    name = fl-studio-tile
    match:class = ^(fl64.exe)$
    tile = on
}


#######################################
### SYSTEM UTILITIES
#######################################

# xwaylandvideobridge - hide completely for screensharing
windowrule {
    name = xwayland-videobridge-hide
    match:class = ^(xwaylandvideobridge)$
    opacity = 0.0 override
    no_anim = on
    no_initial_focus = on
    max_size = 1 1
    no_blur = on
}


#######################################
### CUSTOM APPLICATIONS
#######################################

# Ollama Dmenu App - dmenu-style launcher
windowrule {
    name = ollama-dmenu-float
    match:class = ^(com.bandit.OllamaDmenuApp)$
    float = on
    center = on
    border_size = 0
    stay_focused = on
    idle_inhibit = fullscreen
}

# Note: noinitialfocus removed - conflicts with stay_focused behavior


#######################################
### DIALOG WINDOWS
#######################################

# Generic "Open File" dialogs - always float
windowrule {
    name = open-file-dialog
    match:title = ^(Open File)$
    float = on
}

# Generic "Save File" dialogs - always float
windowrule {
    name = save-file-dialog
    match:title = ^(Save File)$
    float = on
}

# Generic file chooser dialogs
windowrule {
    name = file-chooser-dialog
    match:title = ^(.*[Ff]ile [Cc]hooser.*)$
    float = on
}


#######################################
### LAYER RULES (for Waybar, etc.)
#######################################

# Uncomment these if you want blur on layers:
# layerrule = blur, waybar
# layerrule = blur, wlogout
# layerrule = blurpopups, wlogout
# layerrule = ignorezero, wlogout
# layerrule = ignorealpha 0.3, wlogout

# (The face-scan eye now rides on the shared caelestia shell surface like the
#  dashboard, so no per-layer blur is needed here. If you re-enable shell
#  transparency and want frosted panels, the v0.53+ syntax is:
#  layerrule = blur on, ignore_alpha 0.15, match:namespace caelestia-drawers )
