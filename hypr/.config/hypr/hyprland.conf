# Global hyprland specific variables
$terminal   = kitty
$menu       = rofi -show drun
$browser     = zen-browser
$editor      = nvim
$music       = spotify
$video       = mpv
$filemanager = yazi
$working_dir = ~/.config/hypr/

$conf_path = ~/.config/hypr
source = $conf_path/hyprland/env.conf
source = $conf_path/hyprland/general.conf
source = $conf_path/hyprland/keybinds.conf
source = $conf_path/hyprland/rules.conf
source = $conf_path/hyprland/exec.conf

###########################
### MONITOR CONFIGURATION ###
###########################

# Fallback monitor config
monitor =   ,   preferred,  auto,   1

$ultrawide      =   HDMI-A-1
$vertical_side  =   DP-1

