# Window Controls
bind = SUPER, Q, killactive,        # Kill the hovered window
bind = SUPER, A, fullscreen,        # Fullscreen 🤷
bind = SUPER, S, togglefloating,    # This makes the current window toggle its floating state. 
bind = SUPER, D, pseudo,            # This makes it possible to resize a window while keeping it in the window grid. It will also match the given aspect of its floating state
bind = SUPER, F, togglesplit,       #  ->  ->  ...   Yeah. That makes sense.
bind = SUPER, G, pin,               # Makes a floating type "Global" It will persist across all workspaces iven if moved.

# QuickShell window controls - Backward button (no modifier needed)
bindn = , mouse:275, exec, ~/.local/bin/toggle-quickshell

# EMERGENCY EXIT - Kill Hyprland and drop to TTY
bind = SUPER, R, exit,              # Exit Hyprland immediately (emergency escape)

# WORKSPACE SWITCHING (Direct)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# MOVE WINDOW TO WORKSPACE
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
