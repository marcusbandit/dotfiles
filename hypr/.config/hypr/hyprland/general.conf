###############################
### LOOK AND FEEL CONFIGURATION ###
###############################

general {
    gaps_in     = 5
    gaps_out    = 10
    border_size = 2

    col.active_border   = rgba(AD44CCee) rgba(F089DEee) 45deg
    col.inactive_border = rgba(302D3Eaa) rgba(595959aa) 45deg

    resize_on_border = false
    allow_tearing    = false

    layout = scrolling
}

decoration {
    rounding          = 10
    rounding_power    = 2
    active_opacity    = 1.0
    inactive_opacity  = 1.0

    dim_special = 0.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled  = true
        size     = 8
        passes   = 2
        vibrancy = 0.1696
        xray = true
        popups = true
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = easeOutExpo,0.19,1,0.22,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutExpo, slide
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 4.5, easeOutExpo, slidevert
}

scrolling {
    focus_fit_method = 1
}


master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
}

#####################
### INPUT SETTINGS ###
#####################

input {
    kb_layout  = us,dk
    kb_variant =
    kb_model   =
    kb_options = caps:backspace, grp:switch
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0

    scroll_factor = 0.8

    numlock_by_default = yes
    special_fallthrough = true
    touchpad {
        natural_scroll = true
    }
}

gestures {
}

cursor {
    no_hardware_cursors = true
}
