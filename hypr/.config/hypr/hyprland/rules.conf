#######################################
### HYPRLAND WINDOW RULES (v0.53+ SYNTAX)
#######################################
# Reference: https://wiki.hypr.land/Configuring/Window-Rules/

#######################################
### VARIABLES
#######################################

# Border colors
$floating_border_active   = rgb(00d4ff)
$floating_border_inactive = rgb(005577)
$pinned_border_active     = rgb(B98578)
$pinned_border_inactive   = rgb(5a3c3c)

# Zen private-browsing windows get their own signal colour (amber, not purple/cyan/coral)
$zen_private_border_active   = rgba(F2A93Bee) rgba(B9683Bee) 45deg
$zen_private_border_inactive = rgba(4a3418aa) rgba(2a1f10aa) 45deg

# Common sizes
$popup_width              = 880
$popup_height             = 652
$dialog_width             = 800
$dialog_height            = 600
$terminal_float_width     = 1350
$terminal_float_height    = 900

# Monitor identifiers (match your hyprland.conf)
$ultrawide                = HDMI-A-1
$vertical_side            = DP-1


#######################################
### WORKSPACE ASSIGNMENT TO MONITORS ###
#######################################

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:DP-1, layout:scrolling, layoutopt:direction:down
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# Special workspaces
workspace = special:music, monitor:DP-1
workspace = special:communication, monitor:DP-1


#######################################
### GLOBAL RULES
#######################################

# Suppress maximize events for all windows (prevents apps from forcing maximize)
windowrule {
    name = global-suppress-maximize
    match:class = .*
    suppress_event = maximize
}


#######################################
### VISUAL / BORDER RULES
#######################################

# Floating (not pinned) - cyan border
windowrule = border_color $floating_border_active $floating_border_inactive, match:float 1, match:pin 0

# Pinned - coral/warm border
windowrule = border_color $pinned_border_active $pinned_border_inactive, match:pin 1


#######################################
### TERMINAL & UTILITY WINDOWS
#######################################

# Clipse clipboard manager - floating popup
windowrule {
    name = clipse-popup
    match:class = clipse
    float = on
    size = $popup_width $popup_height
    stay_focused = on
}

# System update terminal - floating centered
windowrule {
    name = auto-update-terminal
    match:class = auto-update
    float = on
    size = $dialog_width $dialog_height
    center = on
}


#######################################
### BROWSER RULES (ZEN)
#######################################
# Zen is Firefox-based: every window shares class "zen", so everything below
# discriminates on title. Titles end in "Zen Browser" / "Zen Browser Private Browsing".

# --- Main window ---------------------------------------------------------

# Zen Browser - workspace assignment + tag for downstream rules
windowrule {
    name = zen-browser-workspace
    match:class = ^(zen)$
    workspace = 1
    tag = +browser
}

# Keep the screen alive while a video is fullscreened
windowrule {
    name = zen-idle-inhibit
    match:class = ^(zen)$
    idle_inhibit = fullscreen
}

# Fullscreen video should be edge-to-edge, no chrome bleeding in
windowrule {
    name = zen-fullscreen-clean
    match:class = ^(zen)$
    match:fullscreen = 1
    border_size = 0
    rounding = 0
    no_blur = on
}

# --- Private browsing ----------------------------------------------------

# Amber border so a private window is never mistaken for a normal one
windowrule {
    name = zen-private-border
    match:class = ^(zen)$
    match:title = .*Private Browsing.*
    border_color = $zen_private_border_active $zen_private_border_inactive
}

# --- Picture-in-Picture --------------------------------------------------

# PiP: floating, pinned above everything, no chrome.
# Bottom-right placement is NOT done here: verified on 0.56.1, windowrule
# `move` only accepts literal integers (no %, no w/h, no onscreen/cursor),
# so a corner anchor would have to be hardcoded pixels that break on the
# vertical monitor. ~/.local/bin/zen-pip-place computes it live instead.
windowrule {
    name = zen-pip
    match:class = ^(zen)$
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    keep_aspect_ratio = on
    border_size = 0
    rounding = 0
    no_blur = on
    no_shadow = on
    no_initial_focus = on
    render_unfocused = on
}

# --- Dialogs & pickers ---------------------------------------------------

# Zen's own file pickers / save dialogs (the portal ones are covered further down)
windowrule {
    name = zen-file-dialogs
    match:class = ^(zen)$
    match:title = ^(File Upload|Save As|Save Image|Save Page As|Select Files?|Open|Enter name of file to save to.*)$
    float = on
    center = on
    size = $dialog_width $dialog_height
}

# Library / Bookmarks / History / Downloads standalone windows
windowrule {
    name = zen-library-window
    match:class = ^(zen)$
    match:title = ^(Library|Bookmarks|History|Downloads|Add-ons Manager|Page Info.*)$
    float = on
    center = on
    size = $popup_width $popup_height
}

# Detached Developer Tools - float big, no rounding (it renders its own chrome)
windowrule {
    name = zen-devtools
    match:class = ^(zen)$
    match:title = ^(Developer Tools.*|DevTools.*)$
    float = on
    center = on
    size = 1600 1000
    rounding = 0
}

# Extension popups opened as real windows
windowrule {
    name = zen-extension-popup
    match:class = ^(zen)$
    match:title = ^(Extension:.*)$
    float = on
    center = on
    size = $popup_width $popup_height
}

# WebRTC "Sharing Indicator" - hide it completely (same trick as videobridge)
windowrule {
    name = zen-sharing-indicator-hide
    match:class = ^(zen)$
    match:title = .*Sharing Indicator.*
    float = on
    opacity = 0.0 override
    no_anim = on
    no_initial_focus = on
    no_focus = on
    max_size = 1 1
    no_blur = on
}


#######################################
### DEVELOPMENT TOOLS
#######################################

# Cursor IDE - workspace assignment
windowrule {
    name = cursor-ide-workspace
    match:class = ^(cursor)$
    workspace = 2
}


#######################################
### MEDIA & ENTERTAINMENT
#######################################

# mpv - borderless, no rounding, pure video
windowrule {
    name = mpv-borderless
    match:class = ^(mpv)$
    border_size = 0
    rounding = 0
}

# Spotify - transparency and special workspace
windowrule {
    name = spotify-opacity
    match:class = ^([Ss]potify)$
    opacity = 0.9 override
}

windowrule {
    name = spotify-workspace
    match:class = ^([Ss]potify)$
    workspace = special:music
}

# Vesktop (Discord) - special workspace
windowrule {
    name = vesktop-workspace
    match:class = ^(vesktop)$
    workspace = special:communication
}

# Telegram - special workspace
windowrule {
    name = telegram-workspace
    match:class = ^(org\.telegram\.desktop|[Tt]elegram[Dd]esktop)$
    workspace = special:communication
}

windowrule {
    name = screensharing
    match:class = ^(hyprland-share-picker)$

    float = on
}

#######################################
### ANDROID (WAYDROID)
#######################################

# Waydroid full UI - floating, phone-like size
windowrule {
    name = waydroid-float
    match:class = ^(Waydroid)$
    float = on
    size = 675 1350
    center = on
}


#######################################
### GAMING
#######################################

# Hytale Launcher - workspace 2, centered
windowrule {
    name = hytale-launcher
    match:class = ^(Hytale-launcher)$
    workspace = 2
    center = on
}

# Steam games - workspace 3
windowrule {
    name = steam-games-workspace
    match:class = ^(steam_app.*)$
    workspace = 3
}

# Satisfactory Mod Manager - always launch floating
windowrule {
    name = satisfactory-mod-manager-float
    match:class = ^(Satisfactory Mod Manager)$
    float = on
}

# Sober (Roblox) - disable compositor blur and rounding to avoid artifacts
windowrule {
    name = sober-no-blur
    match:class = ^(sober)$
    no_blur = on
    rounding = 0
}

# Minecraft - pseudo-tiled at ultrawide resolution
windowrule {
    name = minecraft-layout
    match:class = ^Minecraft.*
    tile = on
    pseudo = on
    size = 3440 1440
}


#######################################
### AUDIO PRODUCTION
#######################################

# FL Studio - force tiled (Wine app)
windowrule {
    name = fl-studio-tile
    match:class = ^(fl64.exe)$
    tile = on
}


#######################################
### SYSTEM UTILITIES
#######################################

# xwaylandvideobridge - hide completely for screensharing
windowrule {
    name = xwayland-videobridge-hide
    match:class = ^(xwaylandvideobridge)$
    opacity = 0.0 override
    no_anim = on
    no_initial_focus = on
    max_size = 1 1
    no_blur = on
}


#######################################
### CUSTOM APPLICATIONS
#######################################

# Ollama Dmenu App - dmenu-style launcher
windowrule {
    name = ollama-dmenu-float
    match:class = ^(com.bandit.OllamaDmenuApp)$
    float = on
    center = on
    border_size = 0
    stay_focused = on
    idle_inhibit = fullscreen
}

# Note: noinitialfocus removed - conflicts with stay_focused behavior

# AniBeam - workspace assignment (silent: don't switch focus)
windowrule {
    name = anibeam-workspace
    match:class = ^(AniBeam)$
    workspace = 2 silent
}


#######################################
### DIALOG WINDOWS
#######################################

# Generic "Open File" dialogs - always float
windowrule {
    name = open-file-dialog
    match:title = ^(Open File)$
    float = on
}

# Generic "Save File" dialogs - always float
windowrule {
    name = save-file-dialog
    match:title = ^(Save File)$
    float = on
}

# Generic file chooser dialogs
windowrule {
    name = file-chooser-dialog
    match:title = ^(.*[Ff]ile [Cc]hooser.*)$
    float = on
}


#######################################
### LAYER RULES (for Waybar, etc.)
#######################################

# Boot reveal overlay -- no animations
layerrule = no_anim on, match:namespace boot-reveal

# Uncomment these if you want blur on layers:
# layerrule = blur, waybar
# layerrule = blur, wlogout
# layerrule = blurpopups, wlogout
# layerrule = ignorezero, wlogout
# layerrule = ignorealpha 0.3, wlogout
