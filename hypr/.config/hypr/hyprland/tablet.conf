##########################
### TABLET CONFIGURATION ###
##########################

# === MONITOR MAPPING ===
# Change $tablet_monitor to remap the tablet to a different screen.
# Use the tabletMap hotkey for interactive region picking.
#
#   HDMI-A-1  →  ultrawide (5120x1440, landscape)
#   DP-1      →  vertical side (1920x1200, portrait)
$tablet_monitor = HDMI-A-1

# === ROTATION ===
# transform values: 0=normal  1=90°CW  2=180°  3=270°CCW
$tablet_transform = 2

# Pen
device {
    name             = wacom-intuos-pro-m-pen
    output           = $tablet_monitor
    transform        = $tablet_transform
    region_position  = 3029 325
    region_size      = 762 749
}

# Touch / finger
device {
    name             = wacom-intuos-pro-m-finger
    output           = $tablet_monitor
    transform        = $tablet_transform
    region_position  = 3029 325
    region_size      = 762 749
}
