##############################################################################
### SLATE - cool grey metal, the green taken out
###
### The idea is unchanged from the greensteel conf this replaces: metal reads
### as metal because of a *luminance ramp with a specular spike*, not because
### of hue. The ramp below is one hue family climbing from near-black to a
### silvery white, and the borders spend most of their length dark so the
### bright stop reads as a highlight catching an edge.
###
### Slate is the cool grey register of that same idea: near-neutral at the
### dark end, with a cold blue-steel saturation only at the top. Values are
### taken verbatim from banditshell's `slate` theme in
### `~/banditshell/config/Themes.qml` so the shell and the compositor's window
### borders are one object rather than two things that happen to both be grey.
###
### Monocraft note: it is a pixel font, so glyph stems are 1 device pixel and
### anti-aliasing has almost nothing to work with. Mid-tones make it mush.
### Anything that renders Monocraft should use $slBright or $slSilver on
### $slAbyss / $slVoid: high luminance distance, low chroma on the dark side.
### Never put pixel text on $slBody / $slBrushed.
##############################################################################

### The metal ramp: near-black -> silvery white, single hue family
$slVoid    = rgb(08090B)
$slAbyss   = rgb(0F1114)
$slDark    = rgb(181B1F)
### Chassis face: what a large panel is made of. One clear step off the abyss so
### a full-height surface reads as a plate with light on it rather than a hole,
### while staying well under $slBody so Monocraft on it is still crisp.
$slPlate   = rgb(1D2126)
$slBody    = rgb(262B31)
$slBrushed = rgb(3A4149)
$slEdge    = rgb(545D67)
$slLit     = rgb(78838F)
$slPale    = rgb(A5AEB8)
$slSilver  = rgb(D0D7DD)
$slChrome  = rgb(EEF2F5)

### Accents: the saturated end, where the cold blue actually shows
$slDim    = rgb(5B8FB0)
$slMid    = rgb(7FB3D4)
$slBright = rgb(B8DCF0)

### The one colour OUTSIDE the hue family, for something about to be taken
### away. Orange, not red: red/green is the pair colour blindness flattens,
### and this must never read as the accent.
$slAlarm  = rgb(FF7A4D)

### Secondary metals, for windows that must not be mistaken for a normal one
$slIce      = rgb(A5DCFF)
$slIceDim   = rgb(3B6279)
$slBrass    = rgb(D8C48C)
$slBrassDim = rgb(6B5C36)

##############################################################################
### Derived: border gradients (alpha-carrying, so they are separate vars)
##############################################################################

### Active: a specular sweep. dark body -> dim -> chrome spike -> mid -> back
### to dark. Full alpha keeps the highlight crisp against the blur.
$slBorderActive0 = rgba(181B1Fff)
$slBorderActive1 = rgba(5B8FB0ff)
$slBorderActive2 = rgba(EEF2F5ff)
$slBorderActive3 = rgba(7FB3D4ff)
$slBorderActive4 = rgba(262B31ff)

### Inactive: the same metal with no light on it. Low chroma, translucent.
### The second stop sits between $slBrushed and $slEdge, the same relative
### position the greensteel conf used.
$slBorderInactive0 = rgba(0F1114aa)
$slBorderInactive1 = rgba(3E454Eaa)

### Shadow: slate-black rather than neutral black, so the cast light matches.
$slShadow = rgba(05060Aee)
