##############################################################################
### GREENSTEEL - cool anodised-green metal
###
### The idea: brushed steel that has been anodised green, not "green paint".
### Metal reads as metal because of a *luminance ramp with a specular spike*,
### not because of hue. So the ramp below is one hue family (~158deg, green
### leaning cyan = cool, never olive) climbing from near-black to a silvery
### white, and the borders spend most of their length dark so the bright stop
### reads as a highlight catching an edge.
###
### Monocraft note: it is a pixel font, so glyph stems are 1 device pixel and
### anti-aliasing has almost nothing to work with. Mid-tones make it mush.
### Anything that renders Monocraft should use $gsPhosphor or $gsSilver on
### $gsAbyss / $gsVoid: high luminance distance, low chroma on the dark side.
### Never put pixel text on $gsBody / $gsBrushed.
##############################################################################

### The metal ramp: near-black -> silvery white, single hue family
$gsVoid    = rgb(070C0A)
$gsAbyss   = rgb(0D1512)
$gsDark    = rgb(16211C)
### Chassis face: what a large panel is made of. One clear step off the abyss so
### a full-height surface reads as a plate with light on it rather than a hole,
### while staying well under $gsBody so Monocraft on it is still crisp.
$gsPlate   = rgb(1B2A23)
$gsBody    = rgb(22322B)
$gsBrushed = rgb(33493F)
$gsEdge    = rgb(4C6B5C)
$gsLit     = rgb(6E9384)
$gsPale    = rgb(9DBDAF)
$gsSilver  = rgb(C9E2D7)
$gsChrome  = rgb(EAF6F0)
$gsWhite   = rgb(F7FDFA)

### Accents: the "lush" end, where the green actually saturates
$gsVerdigris = rgb(3FBF8F)
$gsLush      = rgb(5FD99A)
$gsPhosphor  = rgb(8CFFC0)

### Secondary metals, for windows that must not be mistaken for a normal one
$gsMint     = rgb(5FF2C4)
$gsMintDim  = rgb(1E6B57)
$gsBrass    = rgb(D8C48C)
$gsBrassDim = rgb(6B5C36)

##############################################################################
### Derived: border gradients (alpha-carrying, so they are separate vars)
##############################################################################

### Active: a specular sweep. dark body -> verdigris -> white spike -> lush ->
### back to dark. Full alpha keeps the highlight crisp against the blur.
$gsBorderActive0 = rgba(16211Cff)
$gsBorderActive1 = rgba(3FBF8Fff)
$gsBorderActive2 = rgba(F7FDFAff)
$gsBorderActive3 = rgba(5FD99Aff)
$gsBorderActive4 = rgba(22322Bff)

### Inactive: the same metal with no light on it. Low chroma, translucent.
$gsBorderInactive0 = rgba(0D1512aa)
$gsBorderInactive1 = rgba(3A4F46aa)

### Shadow: green-black rather than neutral black, so the cast light matches.
$gsShadow = rgba(040907ee)
