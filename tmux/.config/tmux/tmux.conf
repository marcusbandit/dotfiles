set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Keep unattached sessions; ~/.local/bin/tmux-reap-stale.sh reaps any unattached >30min
set -g destroy-unattached off

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes (more intuitive)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+hjkl to switch panes without prefix (faster)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Move current window to a new index (swap instead of move, so it never errors on conflict)
bind . command-prompt -p "swap with window:" "swap-window -t '%%'"

# Alt+arrow keys for pane switching (alternative)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Kill pane/window without confirmation
# Multiple panes: kills just the pane
# Single pane: kills the whole window
unbind x
bind x if-shell "[ $(tmux display -p '#{window_panes}') -gt 1 ]" "kill-pane" "kill-window"
bind X if-shell "[ $(tmux display -p '#{window_panes}') -gt 1 ]" "kill-pane" "kill-window"

# ─────────────────────────────────────────────────────────────────────
#  Minimal orange theme (self-contained: no plugins needed for the look)
#  Accent #5fafff. Status blends into the terminal background.
# ─────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=default,fg=#585858"
set -g status-left-length 100
set -g status-right-length 100

# Left: rounded session pill, then git branch of the active pane (dim orange).
set -g status-left "#[fg=#5fafff,bg=default]#[fg=#1a1a1a,bg=#5fafff,bold] #S #[fg=#5fafff,bg=default] #[fg=#5f87af]#($HOME/.local/bin/tmux-gitbranch.sh '#{pane_current_path}')#[fg=#585858,bg=default]  "

# Window list: active = bold orange, inactive = grey.
# Reset the styles to default first so a previously-loaded theme can't leave a
# background behind; all coloring comes from the -format strings (bg stays transparent).
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-separator "  "
set -g window-status-format "#[fg=#585858]#I:#W"
set -g window-status-current-format "#[fg=#5fafff,bold]#I:#W"

# Right: rounded CPU / MEM pill.
set -g status-right "#[fg=#5fafff,bg=default]#[fg=#1a1a1a,bg=#5fafff,bold] #($HOME/.local/bin/tmux-cpumem.sh) #[fg=#5fafff,bg=default]"

# Panes, messages, copy-mode selection share the accent.
set -g pane-border-style "fg=#2c2c2c"
set -g pane-active-border-style "fg=#5fafff"
set -g message-style "bg=#5fafff,fg=#1a1a1a,bold"
set -g message-command-style "bg=#5fafff,fg=#1a1a1a,bold"
set -g mode-style "bg=#5fafff,fg=#1a1a1a"
setw -g window-status-activity-style "fg=#5f87af"
setw -g clock-mode-colour "#5fafff"

# Plugins (behavior only; the theme above does not depend on them).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Vi mode for copy mode
set-window-option -g mode-keys vi

# Copy mode keybindings (vi-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Enter copy mode
bind [ copy-mode

# Paste from buffer
bind ] paste-buffer

run '~/.tmux/plugins/tpm/tpm'
