set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Detached sessions persist forever, unless they are completely empty
# (one window, one pane, idle shell in ~, no child processes). Those are killed
# the moment their client detaches, by the client-detached hook at the very
# bottom of this file (it has to be set after uxtrace's, see there).
set -g destroy-unattached off

# Keep the server alive with zero sessions. Two reasons:
#  1. the server is owned by ~/.config/systemd/user/tmux.service, which runs it
#     with -D so it lives in its own cgroup instead of inheriting the cgroup of
#     whichever terminal forked it (a server started from kitty keeps
#     kitty-<pid>-0.scope for life and dies when that scope is torn down, which
#     is what wiped every session on 2026-08-24);
#  2. without it, kill-if-empty reaping the LAST session takes the server down
#     too, which would undo point 1 the first time you close an idle shell.
# -D already implies this; setting it here covers a server started any other way.
set -s exit-empty off

# The compositor's instance signature changes on every Hyprland restart, and a
# server that now outlives the compositor will otherwise hand long-lived panes a
# stale one, breaking hyprctl. Refresh it from the attaching client.
# (WAYLAND_DISPLAY, DISPLAY, SSH_AUTH_SOCK and the XDG_* vars are in tmux 3.7's
# default update-environment already; this only adds what is missing.)
set -ga update-environment " HYPRLAND_INSTANCE_SIGNATURE"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes (more intuitive)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+hjkl to switch panes without prefix (faster)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Move current window to a new index (swap instead of move, so it never errors on conflict)
bind . command-prompt -p "swap with window:" "swap-window -t '%%'"

# Alt+arrow keys for pane switching (alternative)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Prefix + Shift+arrow to drag the current window along the tab bar.
# Bare Shift+arrow moves you, prefix Shift+arrow moves the tab. -d keeps the
# selection on your own window so it travels with you; wraps at either end.
bind -r S-Left swap-window -d -t -1
bind -r S-Right swap-window -d -t +1

# Kill pane/window without confirmation
# Multiple panes: kills just the pane
# Single pane: kills the whole window
unbind x
bind x if-shell "[ $(tmux display -p '#{window_panes}') -gt 1 ]" "kill-pane" "kill-window"
bind X if-shell "[ $(tmux display -p '#{window_panes}') -gt 1 ]" "kill-pane" "kill-window"

# ─────────────────────────────────────────────────────────────────────
#  Minimal orange theme (self-contained: no plugins needed for the look)
#  Accent #ffa555. Status blends into the terminal background.
# ─────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=default,fg=#585858"
set -g status-left-length 100
set -g status-right-length 100

# Left: rounded session pill, then git branch of the active pane (dim orange).
set -g status-left "#[fg=#ffa555,bg=default]#[fg=#1a1a1a,bg=#ffa555,bold] #S #[fg=#ffa555,bg=default] #[fg=#bd7b45]#($HOME/.local/bin/tmux-gitbranch.sh '#{pane_current_path}')#[fg=#585858,bg=default]  "

# Window list: active = bold orange, inactive = grey.
# Reset the styles to default first so a previously-loaded theme can't leave a
# background behind; all coloring comes from the -format strings (bg stays transparent).
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-separator "  "
# @claude_symbol is set by ~/.claude/hooks/tmux-claude-status.sh and carries its own
# colour; the #[fg=...] after it resets the rest of the label. Empty on non-Claude windows.
set -g window-status-format "#{@claude_symbol}#[fg=#585858]#I:#W"
set -g window-status-current-format "#{@claude_symbol}#[fg=#ffa555,bold]#I:#W"

# Right: rounded CPU / MEM pill.
set -g status-right "#[fg=#ffa555,bg=default]#[fg=#1a1a1a,bg=#ffa555,bold] #($HOME/.local/bin/tmux-cpumem.sh) #[fg=#ffa555,bg=default]"

# Panes, messages, copy-mode selection share the accent.
set -g pane-border-style "fg=#2c2c2c"
set -g pane-active-border-style "fg=#ffa555"
set -g message-style "bg=#ffa555,fg=#1a1a1a,bold"
set -g message-command-style "bg=#ffa555,fg=#1a1a1a,bold"
set -g mode-style "bg=#ffa555,fg=#1a1a1a"
setw -g window-status-activity-style "fg=#bd7b45"
setw -g clock-mode-colour "#ffa555"

# Plugins (behavior only; the theme above does not depend on them).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Vi mode for copy mode
set-window-option -g mode-keys vi

# Copy mode keybindings (vi-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Enter copy mode
bind [ copy-mode

# Paste from buffer
bind ] paste-buffer

run '~/.tmux/plugins/tpm/tpm'

# uxtrace - tmux usage hooks (loaded quietly; -q ignores a missing file)
#
# Order matters here. uxtrace.tmux sets client-detached with -g, which REPLACES the
# whole hook array, so tmux-kill-if-empty.sh has to be appended with -ga afterwards
# or it gets silently wiped. The -gu first clears the array so repeated
# `source-file` reloads cannot stack duplicates, whether or not uxtrace is present.
set-hook -gu client-detached
source-file -q ~/.config/uxtrace/uxtrace.tmux
set-hook -ga client-detached 'run-shell -b "$HOME/.local/bin/tmux-kill-if-empty.sh"'
