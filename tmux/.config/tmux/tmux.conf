set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes (more intuitive)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+hjkl to switch panes without prefix (faster)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Alt+arrow keys for pane switching (alternative)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Kill pane/window without confirmation
# Multiple panes: kills just the pane
# Single pane: kills the whole window
unbind x
bind x if-shell "[ $(tmux display -p '#{window_panes}') -gt 1 ]" "kill-pane" "kill-window"
bind X if-shell "[ $(tmux display -p '#{window_panes}') -gt 1 ]" "kill-pane" "kill-window"

set -g @catppuccin_flavour 'macchiato'

# Catppuccin theme customization - rounded and feature-rich
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator " | "

set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "language directory git cpu battery date_time session"
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "yes"

# Custom modules
set -g @catppuccin_language_icon ""
set -g @catppuccin_language_color "#{thm_blue}"
set -g @catppuccin_language_text "#(~/.local/bin/tmux-detect-language '#{pane_current_path}')"

# Custom date/time format
set -g @catppuccin_date_time_text "%H:%M"

# Directory display
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Git customization
set -g @catppuccin_git_icon ""
set -g @catppuccin_git_color "#{thm_peach}"
set -g @catppuccin_git_text "#{git_branch}"

# CPU customization
set -g @catppuccin_cpu_icon ""
set -g @catppuccin_cpu_color "#{thm_green}"
set -g @catppuccin_cpu_text "#{cpu_percentage}"

# Battery customization
set -g @catppuccin_battery_icon "󰁹"
set -g @catppuccin_battery_color "#{thm_yellow}"
set -g @catppuccin_battery_text "#{battery_percentage}"

# Directory customization
set -g @catppuccin_directory_icon ""
set -g @catppuccin_directory_color "#{thm_pink}"

# Session customization
set -g @catppuccin_session_icon ""
set -g @catppuccin_session_color "#{thm_mauve}"

# Date/Time customization
set -g @catppuccin_date_time_icon ""
set -g @catppuccin_date_time_color "#{thm_teal}"

# Pane styling
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "top"
set -g @catppuccin_pane_left_separator "█"
set -g @catppuccin_pane_right_separator "█"
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_number_position "left"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_default_text "#{b:pane_current_path}"
set -g @catppuccin_pane_border_style "fg=#{thm_gray}"
set -g @catppuccin_pane_active_border_style "fg=#{thm_blue}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Git integration
set -g @plugin 'tmux-plugins/tmux-git'

# Vi mode for copy mode
set-window-option -g mode-keys vi

# Copy mode keybindings (vi-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Enter copy mode
bind [ copy-mode

# Paste from buffer
bind ] paste-buffer

run '~/.tmux/plugins/tpm/tpm'
